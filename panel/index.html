<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eris Agenda</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#04120E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eris Agenda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-192.png">
<link href="../vendor/fuentes/fuentes.css" rel="stylesheet">
<style>
:root{--fondo:#04120E;--tarjeta:#0A1F18;--claro:#E9FBF4;--apagado:#9CC3B5;--linea:rgba(52,211,153,.18);--verde:#10B981;--verde-luz:#34D399;--rubi:#D1104A;--ambar:#F5B942}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--claro);font-family:'Figtree',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(4,18,14,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea);padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:'Sora',system-ui,sans-serif;font-size:1.15rem;margin:0;line-height:1.25}
.fecha-hoy{color:var(--apagado);font-size:.88rem;margin-top:2px}
.recargar{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--linea);background:var(--tarjeta);color:var(--claro);display:grid;place-items:center;cursor:pointer}
.recargar svg{width:20px;height:20px}
.recargar.girando svg{animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.resumen{display:flex;gap:8px;margin-top:12px;overflow-x:auto}
.chip{flex:none;font-size:.82rem;padding:6px 10px;border-radius:999px;background:var(--tarjeta);border:1px solid var(--linea);color:var(--apagado)}
.chip b{color:var(--claro)}
.chip.alerta{border-color:rgba(245,185,66,.5);color:#F7D58C}
main{padding:8px 16px 0;max-width:640px;margin:0 auto}
h2{font-family:'Sora',system-ui,sans-serif;font-size:.95rem;letter-spacing:.02em;color:var(--apagado);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 .n{background:var(--tarjeta);border:1px solid var(--linea);border-radius:999px;padding:1px 8px;font-size:.78rem;color:var(--claro)}
.vacio{color:#6F9888;font-size:.9rem;padding:10px 2px}
.cita{background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:14px;margin-bottom:10px}
.cita.pendiente{border-color:rgba(245,185,66,.45);box-shadow:0 0 0 1px rgba(245,185,66,.08) inset}
.cita.cancelada{opacity:.55}
.arriba{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hora{font-family:'Sora',system-ui,sans-serif;font-weight:700;font-size:1.25rem;line-height:1}
.dia{color:var(--apagado);font-size:.82rem;margin-top:4px}
.dia::first-letter,.fecha-hoy::first-letter{text-transform:uppercase}
.estado{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap}
.e-pendiente{background:rgba(245,185,66,.15);color:#F7D58C}
.e-confirmada{background:rgba(16,185,129,.15);color:var(--verde-luz)}
.e-propuesta{background:rgba(96,165,250,.15);color:#9CC8FF}
.e-cancelada{background:rgba(209,16,74,.15);color:#FF8FB0}
.e-hecha{background:rgba(255,255,255,.08);color:var(--apagado)}
.e-caducada{background:rgba(255,255,255,.06);color:#8FA89E}
.cita.caducada{opacity:.6}
.punto.x{background:#4F6B60}
.avisos{margin:22px 0 0;background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:14px}
.avisos p{margin:0;font-size:.9rem;color:#CFE9DF;line-height:1.45}
.avisos p b{color:var(--claro)}
.avisos .acciones{margin-top:10px}
.avisos.activo{border-color:rgba(52,211,153,.45)}
.instalar-app .btn{width:100%;margin-top:18px}
.instalar-app .instalar{margin-top:18px}
.avisos.arriba{margin:14px 0 4px;border-color:rgba(52,211,153,.45);background:rgba(16,185,129,.08)}
.cliente{font-weight:700;font-size:1.05rem;margin:12px 0 2px}
.servicio{color:#CFE9DF}
.meta{color:var(--apagado);font-size:.85rem;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}
.meta a{color:var(--verde-luz);text-decoration:none}
.notas{margin-top:8px;font-size:.88rem;color:#CFE9DF;background:rgba(255,255,255,.03);border-radius:10px;padding:8px 10px}
.acciones{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1 1 auto;min-height:44px;font:inherit;font-weight:700;font-size:.92rem;border-radius:12px;border:1px solid transparent;padding:10px 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.b-ok{background:var(--verde);color:#04120E}
.b-otra{background:transparent;color:var(--claro);border-color:var(--linea)}
.b-no{background:transparent;color:#FF8FB0;border-color:rgba(209,16,74,.4);flex:0 0 auto}
.b-wa{background:#1FAF5A;color:#fff}
.proponer{margin-top:10px;display:none}
.proponer.abierto{display:block}
.proponer input{width:100%;min-height:44px;font:inherit;font-size:16px;color:var(--claro);background:#06170F;border:1px solid var(--linea);border-radius:12px;padding:10px 12px}
.proponer .acciones{margin-top:8px}
.aviso{margin-top:10px;font-size:.86rem;color:var(--verde-luz)}
.mensaje{max-width:440px;margin:18vh auto 0;padding:0 16px;text-align:center;color:var(--apagado)}
.mensaje h1{color:var(--claro);margin-bottom:10px}
.instalar{margin:26px 0 8px;font-size:.84rem;color:#6F9888;line-height:1.5}
.instalar b{color:var(--apagado)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:8;display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:1rem;color:#04120E;background:var(--verde);border:0;border-radius:999px;padding:14px 20px;box-shadow:0 10px 28px -8px rgba(16,185,129,.7);cursor:pointer}
.fab span{font-size:1.4rem;line-height:1}
.velo{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.velo.abierto{display:flex}
.hoja{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#0A1F18;border:1px solid var(--linea);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.hoja h3{font-family:'Sora',system-ui,sans-serif;margin:0 0 14px;font-size:1.15rem;display:flex;justify-content:space-between;align-items:center}
.hoja h3 button{background:none;border:0;color:var(--apagado);font-size:1.6rem;cursor:pointer;padding:0 4px}
.campo{display:block;margin-bottom:12px}
.campo span{display:block;font-size:.82rem;color:var(--apagado);margin-bottom:5px}
.campo input,.campo textarea{width:100%;min-height:46px;font:inherit;font-size:16px;color:var(--claro);background:#06170F;border:1px solid var(--linea);border-radius:12px;padding:10px 12px;color-scheme:dark}
.campo textarea{min-height:70px;resize:vertical}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
main{padding-bottom:90px}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login .logo{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 14px}
.login h1{text-align:center;margin-bottom:4px}
.login p.sub{text-align:center;color:var(--apagado);margin:0 0 22px;font-size:.92rem}
.error{color:#FF8FB0;font-size:.88rem;min-height:1.2em;margin:4px 0 10px}
.cuenta{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.cuenta button{font:inherit;font-size:.8rem;color:var(--apagado);background:none;border:1px solid var(--linea);border-radius:999px;padding:6px 10px;cursor:pointer}
.banner{margin:14px 0 0;background:rgba(16,185,129,.1);border:1px solid rgba(52,211,153,.35);border-radius:14px;padding:12px 14px;font-size:.9rem;color:#CFE9DF}
.banner button{margin-top:8px}
.pestanas{display:flex;gap:6px;margin-top:12px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px;padding:4px}
.pestanas button{flex:1;font:inherit;font-weight:700;font-size:.9rem;color:var(--apagado);background:none;border:0;border-radius:9px;padding:9px;cursor:pointer}
.pestanas button[aria-pressed="true"]{background:var(--verde);color:#04120E}
.mes{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.mes h2{margin:0;color:var(--claro);font-size:1.05rem;text-transform:capitalize}
.mes button{width:42px;height:42px;border-radius:12px;border:1px solid var(--linea);background:var(--tarjeta);color:var(--claro);font-size:1.2rem;cursor:pointer}
.rejilla{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.rejilla .cab{text-align:center;font-size:.72rem;color:#6F9888;padding:4px 0;text-transform:uppercase}
.dia-c{position:relative;aspect-ratio:1/1.05;border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.02);color:var(--claro);font:inherit;font-size:.92rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:3px}
.dia-c.fuera{opacity:.3}
.dia-c.hoy{border-color:rgba(52,211,153,.6)}
.dia-c.sel{background:var(--verde);color:#04120E}
.dia-c.pasado{color:#6F9888}
.puntos{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:80%}
.punto{width:6px;height:6px;border-radius:50%;background:var(--verde-luz)}
.punto.p{background:var(--ambar)}
.dia-c.sel .punto{background:#04120E}
.dia-c .num{font-size:.68rem;font-weight:700;color:var(--verde-luz)}
.dia-c.sel .num{color:#04120E}
header>*{max-width:640px;margin-left:auto;margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120%);background:#E9FBF4;color:#04120E;font-weight:700;font-size:.9rem;padding:10px 16px;border-radius:12px;transition:transform .25s,visibility .25s;visibility:hidden;z-index:20;max-width:calc(100% - 32px)}
.toast.ver{transform:translateX(-50%) translateY(0);visibility:visible}
</style>
</head>
<body>
<div id="app"><p class="mensaje">Cargando…</p></div>
<button class="fab" id="nueva" aria-label="Apuntar una cita"><span>+</span> Nueva cita</button>
<div class="velo" id="velo"><form class="hoja" id="formCita" autocomplete="off">
<h3>Apuntar una cita <button type="button" id="cerrarHoja" aria-label="Cerrar">×</button></h3>
<label class="campo"><span>Cliente *</span><input name="cliente" required maxlength="120" placeholder="Nombre"></label>
<div class="dos"><label class="campo"><span>Día *</span><input name="fecha" type="date" required></label>
<label class="campo"><span>Hora *</span><input name="hora" type="time" required step="300"></label></div>
<label class="campo"><span>Servicio</span><input name="servicio" maxlength="200" placeholder="Ej.: cambio de aceite, corte…"></label>
<label class="campo"><span>Teléfono</span><input name="telefono" type="tel" inputmode="tel" maxlength="30" placeholder="Opcional"></label>
<label class="campo"><span>Notas</span><textarea name="notas" maxlength="500" placeholder="Opcional"></textarea></label>
<button class="btn b-ok" type="submit" style="width:100%">Guardar cita</button>
</form></div>
<div class="velo" id="veloAcceso"><form class="hoja" id="formAcceso" autocomplete="on">
<h3>Cambiar contraseña <button type="button" id="cerrarAcceso" aria-label="Cerrar">×</button></h3>
<p style="color:var(--apagado);font-size:.9rem;margin:-4px 0 14px">Al cambiarla, se cerrará la sesión en los demás dispositivos.</p>
<label class="campo"><span>Correo electrónico</span><input name="usuario" type="email" autocomplete="username" required></label>
<label class="campo"><span>Contraseña nueva (mínimo 8 caracteres)</span><input name="clave1" type="password" autocomplete="new-password" required minlength="8"></label>
<label class="campo"><span>Repite la contraseña</span><input name="clave2" type="password" autocomplete="new-password" required minlength="8"></label>
<p class="error" id="errorAcceso"></p>
<button class="btn b-ok" type="submit" style="width:100%">Guardar</button>
</form></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  var API = 'https://erisproject.app.n8n.cloud/webhook/eris-panel';
  var q = new URLSearchParams(location.search);
  var enlaceN = q.get('n'), enlaceK = q.get('k'), n = null, k = null;
  try {
    localStorage.removeItem('eris-panel');
    var g = JSON.parse(localStorage.getItem('eris-agenda') || 'null'); if (g) { n = g.n; k = g.k; }
  } catch (e) {}
  if (enlaceN && enlaceK) history.replaceState(null, '', location.pathname);
  var app = document.getElementById('app');
  var datos = null, cargando = false, pausa = 0, vista = 'resumen', diaSel = null, mesVista = null;
  try { vista = localStorage.getItem('eris-panel-vista') || 'resumen'; } catch (e) {}
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var ETIQUETAS = { pendiente:'Por confirmar', confirmada:'Confirmada', propuesta:'Otra hora propuesta', cancelada:'Cancelada', hecha:'Hecha', caducada:'Sin confirmar · cerrada' };

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function hoyISO(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function nombreDia(iso){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); if (!m) return iso || 'Sin fecha';
    var d = new Date(+m[1], +m[2]-1, +m[3]);
    var h = new Date(); h.setHours(0,0,0,0);
    var dif = Math.round((d - h) / 86400000);
    var base = DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()];
    if (dif === 0) return 'Hoy, ' + base; if (dif === 1) return 'Mañana, ' + base; if (dif === -1) return 'Ayer, ' + base;
    return base;
  }
  function toast(t){ var el = document.getElementById('toast'); el.textContent = t; el.classList.add('ver'); clearTimeout(toast.t); toast.t = setTimeout(function(){ el.classList.remove('ver'); }, 2600); }
  function llamar(cuerpo){
    // text/plain evita la comprobación previa del navegador (CORS)
    return fetch(API, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=UTF-8' }, body: JSON.stringify(cuerpo), cache:'no-store' })
      .then(function(r){ return r.json(); });
  }
  function cargar(){
    if (!n || !k) { pantallaLogin(); return; }
    if (cargando) return; cargando = true;
    var bR = document.getElementById('recargar'); if (bR) bR.classList.add('girando');
    llamar({ n:n, k:k, accion:'ver' }).then(function(d){
      cargando = false;
      if (!d || !d.ok) { olvidar(); pantallaLogin('Tu sesión ha caducado. Vuelve a entrar con tu correo y contraseña.'); return; }
      var primera = !datos; datos = d; document.getElementById('nueva').style.display = ''; pintar();
      if (primera) comprobarAvisos();
    }).catch(function(){
      cargando = false; if (bR) bR.classList.remove('girando');
      if (!datos) app.innerHTML = '<div class="mensaje"><h1>Sin conexión</h1><p>No se ha podido cargar el panel. Comprueba la conexión y vuelve a intentarlo.</p><p><button class="btn b-ok" onclick="location.reload()">Reintentar</button></p></div>';
      else toast('Sin conexión: mostrando lo último cargado');
    });
  }
  function tarjeta(c){
    var tel = c.telefono ? '<a href="tel:' + esc(c.telefono.replace(/\s/g,'')) + '">📞 ' + esc(c.telefono) + '</a>' : '';
    var mail = c.email ? '<a href="mailto:' + esc(c.email) + '">✉️ ' + esc(c.email) + '</a>' : '';
    var acc = '';
    if (c.estado === 'pendiente' || c.estado === 'propuesta') {
      acc = '<div class="acciones">'
        + '<button class="btn b-ok" data-a="confirmar" data-r="' + esc(c.ref) + '">✓ Confirmar</button>'
        + '<button class="btn b-otra" data-a="abrir" data-r="' + esc(c.ref) + '">Otra hora</button>'
        + '<button class="btn b-no" data-a="cancelar" data-r="' + esc(c.ref) + '" aria-label="Cancelar cita">✕</button></div>'
        + '<div class="proponer" id="p-' + esc(c.ref) + '"><input type="text" maxlength="200" placeholder="Ej.: el jueves a las 18:30 o el viernes a las 10:00" aria-label="Hora que propones">'
        + '<div class="acciones"><button class="btn b-ok" data-a="proponer" data-r="' + esc(c.ref) + '">Enviar propuesta</button></div></div>';
    } else if (c.estado === 'confirmada') {
      acc = '<div class="acciones"><button class="btn b-otra" data-a="hecha" data-r="' + esc(c.ref) + '">Marcar como hecha</button><button class="btn b-no" data-a="cancelar" data-r="' + esc(c.ref) + '">Cancelar</button></div>';
    }
    return '<article class="cita ' + esc(c.estado) + '" id="c-' + esc(c.ref) + '">'
      + '<div class="arriba"><div><div class="hora">' + esc(c.hora || '—') + '</div><div class="dia">' + esc(nombreDia(c.fecha)) + '</div></div>'
      + '<span class="estado e-' + esc(c.estado) + '">' + esc(ETIQUETAS[c.estado] || c.estado) + '</span></div>'
      + '<div class="cliente">' + esc(c.cliente) + '</div>'
      + (c.servicio ? '<div class="servicio">' + esc(c.servicio) + '</div>' : '')
      + '<div class="meta">' + tel + mail + '<span>' + (c.canal === 'manual' ? 'apuntada a mano' : 'vía ' + esc(c.canal || 'Eris')) + '</span>' + (String(c.cierre || '').indexOf('auto') === 0 ? '<span>cerrada automáticamente</span>' : '') + '</div>'
      + (c.propuesta ? '<div class="notas">Propuesta enviada: ' + esc(c.propuesta) + '</div>' : '')
      + (c.notas ? '<div class="notas">' + esc(c.notas) + '</div>' : '')
      + acc + '<div class="aviso" id="a-' + esc(c.ref) + '"></div></article>';
  }
  function seccion(titulo, lista, vacio){
    return '<h2>' + titulo + ' <span class="n">' + lista.length + '</span></h2>' + (lista.length ? lista.map(tarjeta).join('') : '<p class="vacio">' + vacio + '</p>');
  }
  function orden(a, b){ return ((a.fecha || '9999') + (a.hora || '99')).localeCompare((b.fecha || '9999') + (b.hora || '99')); }
  function iso(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function calendario(c){
    var hoy = hoyISO();
    if (!diaSel) diaSel = hoy;
    if (!mesVista) { var p = diaSel.split('-'); mesVista = new Date(+p[0], +p[1]-1, 1); }
    var porDia = {};
    c.forEach(function(x){ if (!x.fecha || x.estado === 'cancelada') return; (porDia[x.fecha] = porDia[x.fecha] || []).push(x); });
    var inicio = new Date(mesVista); var desfase = (inicio.getDay() + 6) % 7; inicio.setDate(1 - desfase);
    var h = '<div class="mes"><button data-mes="-1" aria-label="Mes anterior">‹</button><h2>' + MESES[mesVista.getMonth()] + ' ' + mesVista.getFullYear() + '</h2><button data-mes="1" aria-label="Mes siguiente">›</button></div>';
    h += '<div class="rejilla">' + ['L','M','X','J','V','S','D'].map(function(x){ return '<div class="cab">' + x + '</div>'; }).join('');
    for (var i = 0; i < 42; i++) {
      var d = new Date(inicio); d.setDate(inicio.getDate() + i);
      if (i >= 35 && d.getMonth() !== mesVista.getMonth()) break;
      var k2 = iso(d), lista = porDia[k2] || [];
      var cls = 'dia-c' + (d.getMonth() !== mesVista.getMonth() ? ' fuera' : '') + (k2 === hoy ? ' hoy' : '') + (k2 === diaSel ? ' sel' : '') + (k2 < hoy ? ' pasado' : '');
      var puntos = lista.length > 3 ? '<span class="num">' + lista.length + '</span>' : '<span class="puntos">' + lista.map(function(x){ return '<i class="punto' + (x.estado === 'pendiente' || x.estado === 'propuesta' ? ' p' : (x.estado === 'caducada' ? ' x' : '')) + '"></i>'; }).join('') + '</span>';
      h += '<button class="' + cls + '" data-dia="' + k2 + '" aria-label="' + esc(nombreDia(k2)) + ', ' + lista.length + ' citas">' + d.getDate() + puntos + '</button>';
    }
    h += '</div>';
    var delDia = (porDia[diaSel] || []).slice().sort(orden);

    pr.prompt(); pr.userChoice.then(function(){ pintarInstalar(); });
  });
  function puedeRefrescar(){ return !document.hidden && Date.now() > pausa && !document.querySelector('.proponer.abierto') && !velo.classList.contains('abierto') && !veloA.classList.contains('abierto') && !!datos; }
  document.addEventListener('visibilitychange', function(){ if (puedeRefrescar()) cargar(); });
  setInterval(function(){ if (puedeRefrescar()) cargar(); }, 60000);
  if (enlaceN && enlaceK) comprobarEnlace(enlaceN, enlaceK); else cargar();
})();
