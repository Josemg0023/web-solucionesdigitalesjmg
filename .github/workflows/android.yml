# Compila Eris Agenda para Android (Google Play) a partir de android/twa-manifest.json.
# Sale un .aab SIN firmar como artefacto; se firma fuera con la clave de subida (no está en GitHub).
name: Eris Agenda Android
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Configurar Bubblewrap
        run: |
          npm i -g @bubblewrap/cli@1.24.1
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Generar el proyecto Android
        working-directory: android
        run: |
          set -o pipefail
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json 2>&1 | tee ../proyecto.log
      - name: Compilar el paquete (.aab sin firmar) y un .apk de prueba
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease 2>&1 | tee ../compilacion.log
          exit ${PIPESTATUS[0]}
      - name: Guardar el resultado en la rama android-salida
        if: always()
        run: |
          mkdir -p /tmp/salida
          cp android/app/build/outputs/bundle/release/*.aab /tmp/salida/ 2>/dev/null || true
          cp android/app/build/outputs/apk/release/*.apk /tmp/salida/ 2>/dev/null || true
          cp *.log /tmp/salida/ 2>/dev/null || true
          cd /tmp/salida
          git init -q -b android-salida
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A; git commit -q -m "Compilación ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" android-salida
