# Compila Eris Agenda para Android (Google Play) a partir de android/twa-manifest.json.
# Sale un .aab SIN firmar como artefacto; se firma fuera con la clave de subida (no está en GitHub).
name: Eris Agenda Android
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Configurar Bubblewrap
        run: |
          npm i -g @bubblewrap/cli@1.24.1
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Generar el proyecto Android
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
      - name: Compilar el paquete (.aab sin firmar) y un .apk de prueba
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: eris-agenda-sin-firmar
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
