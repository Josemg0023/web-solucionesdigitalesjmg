<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada · Euxenos</title>
<meta name="theme-color" content="#04120E">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png">
<link href="/vendor/fuentes/fuentes.css" rel="stylesheet">
<style>
:root{--fondo:#04120E;--claro:#E9FBF4;--apagado:#9CC3B5;--linea:rgba(52,211,153,.18);--rubi:#D1104A;--rubi-luz:#F0386B;--esmeralda:#10B981;--esmeralda-luz:#34D399}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--claro);font-family:'Figtree',system-ui,sans-serif;font-size:1.0625rem;line-height:1.6;display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:2px solid var(--esmeralda-luz);outline-offset:3px;border-radius:6px}
header{border-bottom:1px solid var(--linea);padding:18px 24px}
header a{display:inline-block}
header img{height:30px;width:auto;display:block}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.caja{max-width:560px;text-align:center}
.codigo{font-family:'Sora',system-ui,sans-serif;font-weight:800;font-size:clamp(4.5rem,18vw,7.5rem);line-height:1;margin:0 0 8px;color:var(--rubi-luz);letter-spacing:-.02em}
h1{font-family:'Sora',system-ui,sans-serif;font-weight:700;font-size:clamp(1.5rem,5vw,2rem);line-height:1.2;margin:0 0 14px}
p{margin:0 0 28px;color:var(--apagado)}
.botones{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.boton{display:inline-flex;align-items:center;font-weight:600;font-size:1rem;text-decoration:none;border-radius:12px;padding:14px 24px;border:1px solid var(--linea)}
.boton.principal{background:var(--rubi);border-color:var(--rubi);color:#fff}
.boton.principal:hover{background:#B80E40}
.boton.sec:hover{border-color:var(--esmeralda-luz)}
.pie{margin-top:28px;font-size:.95rem;color:var(--apagado)}
.pie a{color:var(--esmeralda-luz)}
</style>
</head>
<body>
<header><a href="/" aria-label="Euxenos, ir al inicio"><img src="/marca/euxenos-logo-griego.svg" alt="Euxenos" width="114" height="30"></a></header>
<main>
  <div class="caja">
    <div class="codigo" aria-hidden="true">404</div>
    <h1>No encontramos esta página</h1>
    <p>Puede que el enlace esté mal escrito o que la página ya no exista. Vuelve al inicio o escríbele a Eris y te ayuda ahora mismo.</p>
    <div class="botones">
      <a class="boton principal" href="/">Volver al inicio</a>
      <a class="boton sec" href="/?eris=chat">Hablar con Eris</a>
    </div>
    <p class="pie">¿Prefieres una persona? Llama al <a href="tel:+34919933642">919 93 36 42</a> o escribe a <a href="mailto:contacto@euxenos.com">contacto@euxenos.com</a>.</p>
  </div>
</main>
</body>
</html>
