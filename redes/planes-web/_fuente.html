<!doctype html>

<!-- Vídeos de los planes para la web (horizontal 16:9). Se abre con ?plan=basico|completo|plus
     y se renderiza fotograma a fotograma llamando a window.render(t). -->
<style>
:root{--fondo:#04120E;--claro:#E9FBF4;--apagado:#9CC3B5;--esm:#34D399;--esm2:#10B981;--rubi:#E0336F;--linea:rgba(52,211,153,.22);--panel:rgba(233,251,244,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:var(--fondo)}
#v{position:relative;width:1280px;height:720px;overflow:hidden;color:var(--claro);font-family:'Figtree',sans-serif}
#v::before{content:"";position:absolute;inset:0;background:radial-gradient(700px 500px at 100% 0%,rgba(209,16,74,.20),transparent 70%),radial-gradient(700px 520px at 0% 100%,rgba(16,185,129,.16),transparent 70%),linear-gradient(rgba(52,211,153,.03) 1px,transparent 1px) 0 0/64px 64px,linear-gradient(90deg,rgba(52,211,153,.03) 1px,transparent 1px) 0 0/64px 64px}
.top{position:absolute;left:64px;right:64px;top:40px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.marca{display:flex;align-items:center;gap:12px;font-family:'Sora';font-weight:700;font-size:24px}
.marca img{width:36px;height:36px}
.chip-plan{font-size:17px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--esm);border:1px solid var(--linea);border-radius:999px;padding:8px 16px;background:rgba(52,211,153,.08)}
.barra{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--rubi),var(--esm));z-index:6}
.esc{position:absolute;inset:0;padding:120px 64px 60px;opacity:0;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.esc.centro{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:0;padding-top:90px}
.a{opacity:0;transform:translateY(24px)}
h1{font-family:'Sora';font-weight:800;font-size:74px;line-height:1.02;letter-spacing:-.035em}
h2{font-family:'Sora';font-weight:800;font-size:50px;line-height:1.06;letter-spacing:-.03em}
.g{background:linear-gradient(90deg,#E0336F,#b56a8a 50%,#34D399);-webkit-background-clip:text;color:transparent}
.e{color:var(--esm)}
.sub{font-size:25px;line-height:1.4;color:#CFE9DF;margin-top:22px;max-width:560px}
.esc.centro .sub{max-width:820px}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.esc.centro .chips{justify-content:center}
.chip{font-size:20px;font-weight:600;padding:10px 18px;border-radius:999px;background:var(--panel);border:1px solid var(--linea)}
.lista{margin-top:26px;display:grid;gap:14px}
.lista div{display:flex;gap:14px;align-items:center;font-size:24px;font-weight:500}
.lista div::before{content:"✓";display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:10px;background:rgba(52,211,153,.16);color:var(--esm);font-weight:800}
/* Móvil con chat */
.movil{justify-self:center;width:330px;height:540px;border-radius:44px;background:#0b1d17;border:2px solid var(--linea);box-shadow:0 30px 80px rgba(0,0,0,.45);padding:18px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.cab{display:flex;align-items:center;gap:12px;padding:6px 6px 14px;border-bottom:1px solid var(--linea)}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--esm),var(--esm2));display:grid;place-items:center;font-family:'Sora';font-weight:800;color:#04120E}
.cab b{display:block;font-size:17px}.cab span{font-size:14px;color:var(--apagado)}
.msg{max-width:84%;font-size:17px;line-height:1.35;padding:11px 14px;border-radius:18px}
.msg.cli{align-self:flex-end;background:#1f3a31;border-bottom-right-radius:6px}
.msg.eris{align-self:flex-start;background:var(--claro);color:#0b1d17;border-bottom-left-radius:6px}
.msg small{display:block;font-size:12px;opacity:.6;margin-top:4px}
.aviso{margin-top:auto;background:rgba(52,211,153,.14);border:1px solid var(--esm);border-radius:16px;padding:12px 14px;font-size:15px}
.aviso b{color:var(--esm)}
/* Navegador */
.nav{justify-self:center;width:560px;height:400px;border-radius:18px;background:#0b1d17;border:2px solid var(--linea);box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden;position:relative}
.nav .barra-nav{height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#10261f;border-bottom:1px solid var(--linea)}
.nav .barra-nav i{width:11px;height:11px;border-radius:50%;background:#2c4a40}
.nav .url{margin-left:12px;font-size:14px;color:var(--apagado);background:#0b1d17;border-radius:8px;padding:5px 12px}
.nav .heroe{padding:30px 30px 0}
.nav .heroe b{display:block;font-family:'Sora';font-size:30px;font-weight:800;line-height:1.1}
.nav .heroe span{display:block;margin-top:10px;font-size:15px;color:var(--apagado)}
.nav .bloques{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:22px 30px}
.nav .bloques div{height:74px;border-radius:12px;background:var(--panel);border:1px solid var(--linea)}
.widget{position:absolute;right:16px;bottom:16px;width:270px;background:#0e231c;border:1px solid var(--esm);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.widget .msg{font-size:14px;padding:9px 12px}
/* Llamada y calendario */
.tarjeta{justify-self:center;width:440px;background:#0b1d17;border:2px solid var(--linea);border-radius:28px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.llamada .et{font-size:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--apagado)}
.llamada .num{font-family:'Sora';font-weight:800;font-size:36px;margin-top:8px}
.onda{display:flex;gap:6px;align-items:center;height:70px;margin:22px 0}
.onda i{flex:1;border-radius:4px;background:var(--esm)}
.llamada .dice{background:var(--claro);color:#0b1d17;border-radius:18px 18px 18px 6px;padding:14px 16px;font-size:18px;line-height:1.35}
.cal .mes{font-family:'Sora';font-weight:700;font-size:22px;margin-bottom:16px}
.cal .fila{display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;background:var(--panel);margin-top:10px;font-size:18px}
.cal .fila b{font-family:'Sora';min-width:70px}
.cal .fila.nueva{background:rgba(52,211,153,.16);border:1px solid var(--esm)}
.cal .ok{margin-left:auto;font-size:14px;font-weight:700;color:#04120E;background:var(--esm);padding:5px 10px;border-radius:999px}
/* Presupuesto */
.pdf{justify-self:center;width:440px;background:#F4FBF8;color:#0b1d17;border-radius:18px;padding:28px 30px;box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative}
.pdf .t{font-family:'Sora';font-weight:800;font-size:24px}
.pdf .c{font-size:14px;color:#4b6b60;margin-top:4px}
.pdf .l{display:flex;justify-content:space-between;font-size:17px;padding:11px 0;border-bottom:1px solid #d6e9e1}
.pdf .tot{display:flex;justify-content:space-between;font-family:'Sora';font-weight:800;font-size:22px;padding-top:14px}
.pdf .btn{margin-top:20px;text-align:center;font-family:'Sora';font-weight:700;font-size:19px;color:#04120E;background:var(--esm);border-radius:14px;padding:14px}
.sello{position:absolute;top:24px;right:24px;transform:rotate(-8deg);border:3px solid var(--esm2);color:var(--esm2);font-family:'Sora';font-weight:800;font-size:18px;padding:6px 12px;border-radius:10px}
/* Precio */
.precio{margin-top:30px;display:flex;gap:22px;align-items:stretch;justify-content:center}
.precio .caja{background:var(--panel);border:1px solid var(--linea);border-radius:24px;padding:22px 34px;min-width:280px}
.precio .caja.dest{border-color:var(--esm);background:rgba(52,211,153,.12)}
.precio .et{font-size:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--esm)}
.precio .cifra{font-family:'Sora';font-weight:800;font-size:54px;margin-top:6px}
.precio .cifra small{font-size:22px;font-weight:600;color:var(--apagado)}
.precio .iva{font-size:17px;color:var(--apagado);margin-top:4px}
.pie{margin-top:26px;font-size:22px;color:#CFE9DF}
.pie b{color:var(--esm)}
/* App Euxenos */
.movil.app{position:relative;padding-top:74px}
.push{position:absolute;left:12px;right:12px;top:12px;background:#E9FBF4;color:#0b1d17;border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.35;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.cita{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--linea);border-radius:16px;padding:12px 14px}
.cita b{display:block;font-family:'Sora';font-size:17px}.cita span{font-size:14px;color:var(--apagado)}
.cita .botones{display:flex;gap:8px}.cita .botones i{font-style:normal;font-size:14px;font-weight:700;padding:7px 12px;border-radius:10px;border:1px solid var(--linea)}
.cita .botones .ok-b{background:var(--esm);color:#04120E;border-color:var(--esm)}
.cita.conf{border-color:var(--esm);background:rgba(52,211,153,.14)}
.recor{margin-top:auto;font-size:14px;color:var(--apagado);text-align:center}
/* Desvío y aviso */
.desvio .paso-d{display:flex;gap:16px;align-items:center;padding:16px;border-radius:16px;background:var(--panel)}
.desvio .paso-d.e{background:rgba(52,211,153,.14);border:1px solid var(--esm)}

.desvio b{display:block;font-family:'Sora';font-size:22px}.desvio span{font-size:15px;color:var(--apagado)}
.desvio .flecha{text-align:center;color:var(--esm);font-weight:700;font-size:17px;margin:10px 0}
.aviso-l .et{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--esm);margin-bottom:12px}
.aviso-l .linea{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--linea);font-size:18px}
.aviso-l .linea span{color:var(--apagado)}
.bocadillo{display:inline-block;margin-top:26px;background:var(--claro);color:#0b1d17;font-family:'Sora';font-weight:700;font-size:40px;padding:18px 30px;border-radius:30px 30px 30px 8px}

var esc = [].slice.call(document.querySelectorAll('.esc'));
function ease(x){ x = Math.max(0, Math.min(1, x)); return 1 - Math.pow(1 - x, 3); }
window.render = function(t){
  T = window.T || T; FIN = window.FIN || FIN;
  esc.forEach(function(s, i){
    var ini = T[i], fin = i + 1 < T.length ? T[i + 1] : FIN + 1;
    var vis = t >= ini - 0.001 && t < fin;
    var fadeOut = ease((fin - t) / 0.35), fadeIn = ease((t - ini) / 0.35);
    s.style.opacity = vis ? Math.min(fadeIn, fadeOut) : 0;
    var auto = [].filter.call(s.querySelectorAll('.a'), function(h){ return !h.hasAttribute('data-d'); });
    auto.forEach(function(h, k){ var p = ease((t - ini - 0.1 - k * 0.35) / 0.45); h.style.opacity = p; h.style.transform = 'translateY(' + (24 * (1 - p)) + 'px)'; });
    s.querySelectorAll('.a[data-d]').forEach(function(h){ var p = ease((t - ini - parseFloat(h.getAttribute('data-d'))) / 0.4); h.style.opacity = p; h.style.transform = (h.classList.contains('sello') ? 'rotate(-8deg) scale(' + (1.6 - .6 * p) + ')' : 'translateY(' + (24 * (1 - p)) + 'px)'); });
  });
  if (onda) [].forEach.call(onda.children, function(b, k){ b.style.height = (12 + 46 * Math.abs(Math.sin(t * 5 + k * 0.7)) * (0.4 + 0.6 * Math.abs(Math.sin(t * 1.3 + k)))) + 'px'; });
  document.getElementById('barra').style.width = (Math.min(1, t / FIN) * 100) + '%';
};
render(0);
</script>
</body></html>
